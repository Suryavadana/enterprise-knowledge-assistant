services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-eka_db}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  chromadb:
    image: chromadb/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /data
    volumes:
      - chroma_data:/data
    ports:
      - "8000:8000"
    healthcheck:
      # The image ships python but not curl/wget, so use urllib to hit the
      # v2 heartbeat endpoint (the backend's ChromaService also talks to
      # the /api/v2/... routes - see ChromaService.java).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v2/heartbeat')"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./server/server
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-eka_db}
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      CHROMA_BASE_URL: http://chromadb:8000
      # GEMINI_API_KEY and JWT_SECRET are real secrets - they're never set
      # here directly. Docker Compose automatically loads a `.env` file from
      # the project root (see .env.example) and substitutes ${...} below with
      # its values. That file is gitignored; only .env.example is committed.
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      JWT_SECRET: ${JWT_SECRET}

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mysql_data:
  chroma_data:
